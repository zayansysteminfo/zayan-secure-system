<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A&amp;O Login Alert System</title>
  <style>
    :root {
      --bg: #02040a;
      --panel: rgba(3, 10, 18, 0.78);
      --panel-strong: rgba(4, 16, 28, 0.92);
      --cyan: #00f5ff;
      --green: #00ff88;
      --red: #ff2f6d;
      --gold: #ffc857;
      --violet: #9b5cff;
      --text: #e8fbff;
      --muted: rgba(232, 251, 255, 0.62);
      --line: rgba(0, 245, 255, 0.28);
      --shadow: 0 0 35px rgba(0, 245, 255, 0.22);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 22px;
    }

    #matrixCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 10%, rgba(0, 245, 255, 0.15), transparent 33%),
        radial-gradient(circle at 10% 90%, rgba(0, 255, 136, 0.11), transparent 32%),
        radial-gradient(circle at 88% 70%, rgba(255, 47, 109, 0.09), transparent 30%),
        radial-gradient(circle at 78% 18%, rgba(155, 92, 255, 0.12), transparent 30%),
        #02040a;
    }

    .scanline {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 50%, rgba(0, 0, 0, 0.18) 50%),
        linear-gradient(90deg, rgba(255, 0, 90, 0.04), rgba(0, 245, 255, 0.035), rgba(0, 255, 120, 0.035));
      background-size: 100% 4px, 8px 100%;
      mix-blend-mode: screen;
      opacity: 0.72;
    }

    .orb {
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 1;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb.one { left: -90px; top: -70px; background: var(--cyan); }
    .orb.two { right: -110px; bottom: -80px; background: var(--red); animation-delay: 1.5s; }
    .orb.three { right: 22%; top: -150px; background: var(--violet); animation-delay: 2.2s; opacity: 0.12; }

    @keyframes float {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(30px, -18px, 0) scale(1.08); }
    }

    .shell {
      position: relative;
      z-index: 3;
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 22px;
      align-items: stretch;
    }

    .brand-panel,
    .login-panel {
      background: linear-gradient(145deg, rgba(4, 15, 28, 0.86), rgba(3, 7, 16, 0.82));
      border: 1px solid var(--line);
      box-shadow: var(--shadow), inset 0 0 30px rgba(0, 245, 255, 0.05);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
    }

    .brand-panel {
      padding: 34px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-panel::before,
    .login-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(130deg, rgba(0, 245, 255, 0.68), rgba(0, 255, 136, 0.12), rgba(255, 47, 109, 0.5), rgba(155, 92, 255, 0.42));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .top-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 9px 13px;
      border: 1px solid rgba(0, 255, 136, 0.28);
      border-radius: 999px;
      color: var(--green);
      background: rgba(0, 255, 136, 0.06);
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .pulse {
      width: 9px;
      height: 9px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 18px var(--green);
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.26; transform: scale(0.78); }
    }

    .main-logo {
      width: min(310px, 100%);
      margin-top: 30px;
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid rgba(0, 245, 255, 0.24);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.08), rgba(155, 92, 255, 0.09), rgba(0, 0, 0, 0.18));
      box-shadow: inset 0 0 24px rgba(0, 245, 255, 0.05);
    }

    .zb-logo {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 14px rgba(0, 245, 255, 0.3));
    }

    .brand-title h1 {
      font-size: clamp(32px, 4.7vw, 54px);
      line-height: 0.98;
      letter-spacing: -2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0, 245, 255, 0.42);
    }

    .brand-title h1 span {
      display: block;
      color: var(--cyan);
    }

    .brand-title p {
      margin-top: 18px;
      max-width: 460px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .code-strip {
      margin-top: 30px;
      padding: 17px;
      border: 1px dashed rgba(0, 245, 255, 0.28);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.24);
      color: rgba(0, 255, 136, 0.78);
      font-size: 12px;
      line-height: 1.7;
      min-height: 112px;
      overflow: hidden;
    }

    .mini-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .stat {
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 14px;
      padding: 14px 12px;
      background: rgba(0, 0, 0, 0.22);
    }

    .stat strong {
      display: block;
      color: var(--cyan);
      font-size: 17px;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .login-panel {
      padding: 34px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .login-head {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo-mark {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 26px;
      border: 1px solid rgba(0, 245, 255, 0.42);
      display: grid;
      place-items: center;
      box-shadow: 0 0 26px rgba(0, 245, 255, 0.26), inset 0 0 18px rgba(0, 245, 255, 0.08);
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(0, 245, 255, 0.18), rgba(0, 0, 0, 0.22) 60%);
    }

    .logo-mark::after {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: 32px;
      border: 1px solid rgba(255, 47, 109, 0.22);
    }

    .logo-mark svg {
      width: 70px;
      height: 70px;
      filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.45));
    }

    .login-head h2 {
      font-size: 25px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text);
    }

    .login-head p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .field-area {
      min-height: 140px;
      position: relative;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--green);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    input {
      width: 100%;
      height: 58px;
      border: 1px solid rgba(0, 245, 255, 0.35);
      background: rgba(0, 0, 0, 0.42);
      border-radius: 14px;
      outline: none;
      padding: 0 16px;
      color: #fff;
      font-size: 17px;
      letter-spacing: 0.8px;
      box-shadow: inset 0 0 18px rgba(0, 245, 255, 0.04);
      transition: 0.25s ease;
    }

    input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 22px rgba(0, 245, 255, 0.24), inset 0 0 18px rgba(0, 245, 255, 0.06);
    }

    .primary-btn {
      width: 100%;
      height: 56px;
      margin-top: 15px;
      border-radius: 14px;
      border: 1px solid rgba(0, 245, 255, 0.48);
      background: linear-gradient(90deg, rgba(0, 245, 255, 0.14), rgba(0, 255, 136, 0.11));
      color: var(--cyan);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .primary-btn:hover {
      color: #051018;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      box-shadow: 0 0 26px rgba(0, 245, 255, 0.38);
    }

    .terminal {
      margin-top: 24px;
      height: 92px;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid rgba(0, 255, 136, 0.16);
      background: rgba(0, 0, 0, 0.34);
      padding: 13px 14px;
      color: rgba(0, 255, 136, 0.82);
      line-height: 1.65;
      font-size: 11px;
    }

    .terminal .warn { color: var(--red); }
    .terminal .ok { color: var(--cyan); }

    /* Login Alert Page Styles */
    .login-alert-page {
      display: none;
      z-index: 5;
      width: min(1420px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      padding: 34px;
      background: linear-gradient(145deg, rgba(16, 7, 14, 0.95), rgba(3, 7, 16, 0.92));
      border: 1px solid rgba(255, 47, 109, 0.32);
      box-shadow: 0 0 38px rgba(255, 47, 109, 0.18), inset 0 0 26px rgba(255, 255, 255, 0.025);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      position: relative;
    }

    .login-alert-page.active {
      display: block;
      animation: pageFadeIn 0.35s ease;
    }

    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .dashboard-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .dark-title {
      font-size: clamp(26px, 4vw, 40px);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ff94b4;
      text-shadow: 0 0 20px rgba(255, 47, 109, 0.35);
    }

    .dark-subtitle {
      margin-top: 8px;
      color: rgba(232, 251, 255, 0.58);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .logout {
      min-width: 130px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(255, 47, 109, 0.55);
      background: rgba(255, 47, 109, 0.09);
      color: var(--red);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 1px;
      transition: 0.25s ease;
    }

    .logout:hover {
      background: rgba(255, 47, 109, 0.22);
      box-shadow: 0 0 22px rgba(255, 47, 109, 0.35);
    }

    .alert-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 20px;
    }

    .alert-stat {
      padding: 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 47, 109, 0.24);
      background: rgba(255, 47, 109, 0.045);
      box-shadow: inset 0 0 18px rgba(255, 47, 109, 0.035);
    }

    .alert-stat span {
      display: block;
      color: rgba(232, 251, 255, 0.58);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .alert-stat strong {
      color: var(--red);
      font-size: 26px;
      text-shadow: 0 0 16px rgba(255, 47, 109, 0.32);
    }

    .alert-toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-top: 20px;
      align-items: center;
    }

    .alert-toolbar input {
      height: 50px;
      border-color: rgba(255, 47, 109, 0.32);
      background: rgba(0, 0, 0, 0.45);
      font-size: 14px;
    }

    .alert-refresh-btn,
    .alert-sound-test-btn {
      height: 50px;
      padding: 0 20px;
      border-radius: 13px;
      cursor: pointer;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: 0.22s ease;
    }

    .alert-refresh-btn {
      border: 1px solid rgba(255, 47, 109, 0.45);
      background: rgba(255, 47, 109, 0.08);
      color: var(--red);
    }

    .alert-refresh-btn:hover {
      background: rgba(255, 47, 109, 0.18);
      box-shadow: 0 0 18px rgba(255, 47, 109, 0.25);
    }

    .alert-sound-test-btn {
      border: 1px solid rgba(0, 255, 136, 0.42);
      color: var(--green);
      background: rgba(0, 255, 136, 0.07);
    }

    .alert-sound-test-btn:hover {
      background: rgba(0, 255, 136, 0.16);
      box-shadow: 0 0 18px rgba(0, 255, 136, 0.25);
    }

    .alert-list-wrap {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .alert-card {
      display: grid;
      grid-template-columns: minmax(230px, 1fr) minmax(140px, .6fr) minmax(180px, .8fr) minmax(260px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 18px;
      border-radius: 17px;
      border: 1px solid rgba(255, 47, 109, 0.24);
      background: linear-gradient(135deg, rgba(41, 13, 24, 0.92), rgba(9, 13, 23, 0.94));
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
    }

    .alert-card small {
      display: block;
      color: rgba(220, 231, 255, 0.55);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .alert-card strong {
      display: block;
      color: #fff;
      font-size: 16px;
      word-break: break-word;
    }

    .alert-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ff7f9a;
      background: rgba(255, 47, 109, 0.12);
      border: 1px solid rgba(255
